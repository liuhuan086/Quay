name: SwiftFTP
options:
  bundleIdPrefix: com.swiftftp
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.5"
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    DEAD_CODE_STRIPPING: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: "0.7.0"

targets:
  SwiftFTP:
    type: application
    platform: macOS
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Sources/Resources/Assets.xcassets
      - path: Sources/Resources/Acknowledgements.json
    dependencies:
      - package: Citadel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftftp.app
        INFOPLIST_FILE: Sources/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Resources/SwiftFTP.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGNING_REQUIRED: "YES"
        DEAD_CODE_STRIPPING: "YES"
        DEVELOPMENT_TEAM: UW4Z5U4U66
        ENABLE_HARDENED_RUNTIME: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          SWIFT_COMPILATION_MODE: wholemodule
    info:
      path: Sources/Resources/Info.plist
    entitlements:
      path: Sources/Resources/SwiftFTP.entitlements

  SwiftFTPTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: SwiftFTP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftftp.tests
        DEAD_CODE_STRIPPING: "YES"
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SwiftFTP.app/Contents/MacOS/SwiftFTP"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  SwiftFTP:
    build:
      targets:
        SwiftFTP: all
        SwiftFTPTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SwiftFTPTests
    archive:
      config: Release
